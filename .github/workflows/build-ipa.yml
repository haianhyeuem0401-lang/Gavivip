
name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Xcode project
        id: project
        run: |
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "Không tìm thấy Xcode project"
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          xcodebuild \
            -project "${{ steps.project.outputs.project }}" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r GaviStore-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GaviStore-unsigned-IPA
          path: GaviStore-unsigned.ipa
